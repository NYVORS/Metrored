name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el release con el APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version automatica (3.2.N, donde N = numero de compilacion)
        run: |
          V="3.2.${{ github.run_number }}"
          FILES=$(find . -name app.js -not -path './node_modules/*' -not -path './android/*' -not -path './.git/*')
          if [ -z "$FILES" ]; then echo "No se encontro app.js"; exit 1; fi
          for F in $FILES; do sed -i -E "s/APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'/APP_VERSION = '$V'/" "$F"; done
          grep -h "APP_VERSION = " $FILES | head -1 | grep -q "'$V'" || { echo "No se pudo escribir la version en app.js"; exit 1; }
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android (solo si no existe)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Version del APK (para que Android acepte la actualizacion)
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \".*\"/versionName \"$APP_VERSION\"/" "$G"
          grep -E "versionCode|versionName" "$G"

      - name: Permisos de ubicacion (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M" || { echo "No se pudieron agregar los permisos de ubicacion"; exit 1; }

      - name: Icono de la app
        run: |
          R=android/app/src/main/res
          find "$R" -path '*mipmap-*' -name 'ic_launcher*' -delete
          unzip -o icons.zip -d "$R"
          ls "$R"/mipmap-xxxhdpi "$R"/mipmap-anydpi-v26

      - name: Llave de firma fija (para poder actualizar sin desinstalar)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Falta el secret DEBUG_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"; exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: metrored-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar release (para el aviso de actualizacion dentro de la app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="MetroRed-$APP_VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" "$APK" --clobber
          else
            gh release create "v$APP_VERSION" "$APK" --title "MetroRed $APP_VERSION" --notes "Actualizacion MetroRed $APP_VERSION" --latest
          fi
