<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a4f33">
  <title>Redmetro Rioverde en vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">🚌</span>
      <div>
        <strong>Redmetro Rioverde en vivo</strong>
        <small>Zona Media · Gratuito · Sin límites</small>
      </div>
    </div>
    <span id="status" class="status">DEMO</span>
  </header>

  <section id="sheet" class="sheet">
    <button id="grab" class="grab" aria-label="Expandir o contraer"></button>
    <nav id="lines" class="tabs"></nav>
    <nav id="dirs" class="dirs"></nav>
    <div id="stops" class="stops"></div>
    <p class="disclaimer">App independiente, no oficial. Rutas basadas en el mapa público de la SCT. Tiempos simulados en esta versión de prueba.</p>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
