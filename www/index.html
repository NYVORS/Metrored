<!doctype html>
<html lang="es" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#064d2e">
  <title>MetroRed Rioverde</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="manifest" href="metrored.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <img class="logo-img" src="icon.png" alt="MetroRed SLP GPS">
      <div>
        <strong>MetroRed Rioverde</strong>
      </div>
    </div>
    <span id="status" class="status">BETA</span>
  </header>

  <div id="editor" class="editor" hidden>
    <b>Modo editor</b>
    <span>Arrastra cada parada a su lugar real en el mapa.</span>
    <div>
      <button id="btnCopy">Copiar posiciones</button>
      <button id="btnReset">Restablecer</button>
      <button id="btnDone">Listo</button>
    </div>
  </div>

  <button id="locBtn" class="locbtn" aria-label="Mi ubicaci&#xF3;n">&#x1F4CD;</button>
  <div id="perm" class="perm" hidden>
    <div class="permbox">
      <div class="permic">&#x1F4CD;</div>
      <b>&#xBF;Permites usar tu ubicaci&#xF3;n?</b>
      <p>Para saber en qu&#xE9; parada est&#xE1;s y cu&#xE1;nto falta para el siguiente MetroRed. Solo te lo pedimos una vez.</p>
      <button id="permOk">Permitir ubicaci&#xF3;n</button>
      <button id="permNo" class="ghost">Ahora no</button>
    </div>
  </div>

  <section id="sheet" class="sheet">
    <button id="grab" class="grab" aria-label="Subir o bajar el panel"><span></span></button>
    <div id="net"></div>
    <div id="near"></div>
    <div id="fav"></div>
    <nav id="lines" class="tabs"></nav>
    <nav id="views" class="views"></nav>
    <div id="view" class="view"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="tester-access.js"></script>
  <script src="tester-panel.js"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
</html>
